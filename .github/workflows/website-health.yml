name: Website health
on:
  workflow_dispatch:
  schedule:
    - cron: '43 13 * * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare live pages with published Sanity content
        run: npm run check:live
